name: Bug report
description: The audit produced a wrong answer, or crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste telemetry field values, hostnames, usernames or
        command lines. Field names and counts are enough to diagnose almost
        every issue, and this repository exists partly to keep values out of
        reports.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the audit reported, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact command, and a redacted rule or a synthetic corpus that shows it.
      placeholder: |
        dca generate-telemetry --events 100000 --out c.parquet --seed 7
        dca audit --rules rules/ --telemetry c.parquet
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Rule parsing or field extraction
        - Telemetry profiling or field presence
        - Verdict assignment
        - ATT&CK technique rollup
        - Report or JSON output
        - CLI or exit codes
        - Performance
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dca --version`.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Structured log
      description: Run with `--log-level DEBUG` and paste the JSON lines. Redact anything identifying.
      render: json
