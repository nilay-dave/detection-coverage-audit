title: Defender Exclusion Added Via Registry
id: 6c4d2f10-1a7e-4a51-9f2d-2b3a1c9e0007
status: stable
description: Detects registry writes that add a Defender scan exclusion.
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains: '\Windows Defender\Exclusions\'
    Details|contains: '*'
  condition: selection
level: high
tags:
  - attack.defense-evasion
  - attack.t1562.001
