title: Encoded PowerShell Command Line
id: 6c4d2f10-1a7e-4a51-9f2d-2b3a1c9e0001
status: stable
description: Detects PowerShell invoked with an encoded command payload.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection
falsepositives:
  - Administrative scripts that legitimately pass encoded payloads
level: high
tags:
  - attack.execution
  - attack.t1059.001
