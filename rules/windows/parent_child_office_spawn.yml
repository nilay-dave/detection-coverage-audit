title: Office Application Spawning Script Interpreter
id: 6c4d2f10-1a7e-4a51-9f2d-2b3a1c9e0006
status: stable
description: Detects an Office process spawning a script interpreter, a common phishing payload chain.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\powershell.exe'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1204.002
