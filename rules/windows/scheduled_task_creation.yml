title: Scheduled Task Created By Non Admin Path
id: 6c4d2f10-1a7e-4a51-9f2d-2b3a1c9e0005
status: stable
description: Detects schtasks creating a task that runs a binary from a user writable path.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  paths:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
  condition: selection and paths
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
