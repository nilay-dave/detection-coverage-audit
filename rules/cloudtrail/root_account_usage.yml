title: AWS Root Account Console Login
id: 6c4d2f10-1a7e-4a51-9f2d-2b3a1c9e0009
status: stable
description: Detects any console sign in performed by the account root user.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'ConsoleLogin'
    userIdentity.type: 'Root'
  condition: selection
level: critical
tags:
  - attack.initial-access
  - attack.t1078.004
