[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-coverage-audit"
version = "0.1.0"
description = "Finds ATT&CK techniques covered on paper but blind in production by joining detection rules to observed telemetry fields."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["detection-engineering", "mitre-attack", "sigma", "siem", "coverage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "pysigma>=0.11",
  "duckdb>=1.0",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
dca = "dca.cli:app"

[project.urls]
Homepage = "https://github.com/__GITHUB_USERNAME__/detection-coverage-audit"
Documentation = "https://__GITHUB_USERNAME__.github.io/detection-coverage-audit/"
Issues = "https://github.com/__GITHUB_USERNAME__/detection-coverage-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# 120 rather than 88 or 100. Typer declares each CLI option on one line with its
# help text, and wrapping those to 100 columns splits a single declaration
# across four lines for no gain in readability.
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call expressions in parameter defaults. That is the
# library's documented interface, not an accident.
"src/dca/cli.py" = ["B008"]
# Test bodies carry inline rule and event literals. Wrapping them to 100
# columns hurts readability more than the long lines do.
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/dca"]
branch = true
